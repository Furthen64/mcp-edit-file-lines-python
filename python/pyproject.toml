[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-edit-file-lines-python"
version = "0.1.0"
description = "Python migration for line-based file editing MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
